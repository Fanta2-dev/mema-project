services:
  postgres:
    image: postgres:16
    container_name: mema_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mema
      POSTGRES_USER: mema_user
      POSTGRES_PASSWORD: mema_password_dev
    ports:
      - "5432:5432"
    volumes:
      - mema_pgdata:/var/lib/postgresql/data

volumes:
  mema_pgdata: