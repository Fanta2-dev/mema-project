mema.admin.telephone=770000001
mema.admin.mot-de-passe=admin-dev-2026
mema.demo.pharmacien.telephone=770000002
mema.demo.pharmacien.mot-de-passe=pharma-dev-2026

# Cle secrete de signature des connexions.
# Vide = cle aleatoire (il faut se reconnecter apres chaque redemarrage du serveur).
