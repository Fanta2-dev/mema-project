spring.datasource.url=jdbc:postgresql://localhost:5432/mema
spring.datasource.username=mema_user
spring.datasource.password=mema_password_dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html

# Import de fichiers de stock (CSV) : Spring limite a 1 Mo par defaut
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# --- Comptes de demonstration (crees au demarrage s'ils n'existent pas) ---
